[package]
name = "openapi-bridge"
description = "Dynamically exposes OpenAPI endpoints as ACT tools"
version = "0.2.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
schemars = "1"
act-types = "0.11"
ciborium = "0.2"
url = "2"
http = "1"
wasi-fetch = "0.2.0"
wit-bindgen = { version = "0.58", features = ["async-spawn"] }
convert_case = "0.11"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"

[lib]
crate-type = ["cdylib"]
